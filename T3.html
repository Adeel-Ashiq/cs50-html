   <body>
         <style>

         <h1 id="text">I am learning Javascript</h1>
         <button id="change" style="background-color: rgb(235, 227, 227); color:rgb(16, 15, 15)">Change Text Color</button>
         <script>
            document.querySelector('#change').addEventListener('click', function() {
                document.querySelector('h1').style.color = "blue";
                document.querySelector('h1').style.fontSize = "32px";
            });

         </script>
   </body>
